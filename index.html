<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=larder/">
  <title>Larder</title>
</head>
<body style="font-family:Georgia,serif;background:#d5e2d6;color:#241c15;padding:2rem;font-size:1.3rem;">
  <p>Larder has moved. <a href="larder/">Open the list</a>.</p>
  <script>
    (function () {
      var oldScope = location.origin + "/FoodAssistant/";
      function go() { location.replace("larder/" + location.search + location.hash); }
      if (!("serviceWorker" in navigator) || !navigator.serviceWorker.getRegistrations) return go();
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.filter(function (r) { return r.scope === oldScope; }).map(function (r) { return r.unregister(); }));
      }).then(go, go);
    })();
  </script>
</body>
</html>
