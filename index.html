<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d5e2d6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Larder">
  <title>Larder</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="wall-app">
  <header class="top">
    <div class="brand">
      <p class="eyebrow"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span> House food</p>
      <h1>Larder</h1>
    </div>
    <p class="count" id="count">Opening the larder…</p>
    <a class="add-link" href="add.html">Add food</a>
  </header>
  <p class="status" id="status" role="status">Checking the family list…</p>
  <div id="banner" class="banner" role="status" hidden></div>
  <div class="stage">
    <main id="board" class="board" aria-live="polite">
      <p class="loading">Opening the larder…</p>
    </main>
    <section id="used" class="used-panel" hidden></section>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>
    <p class="banner">Larder needs JavaScript. Open this page in Chrome.</p>
  </noscript>
  <script src="config.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
